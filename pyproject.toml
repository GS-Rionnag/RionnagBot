[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rionnagbot"
version = "0.1.0"
description = "Discord onboarding and game tryout application bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1",
]

[tool.setuptools]
py-modules = ["bot", "setup_discord_icons"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
